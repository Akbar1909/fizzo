services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: fizzo
      POSTGRES_PASSWORD: fizzo
      POSTGRES_DB: fizzo
    ports:
      - "5434:5432"
    volumes:
      - fizzo_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fizzo -d fizzo"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_TELEGRAM_BOT_USERNAME: ${NEXT_PUBLIC_TELEGRAM_BOT_USERNAME}
        NEXT_PUBLIC_GA_MEASUREMENT_ID: ${NEXT_PUBLIC_GA_MEASUREMENT_ID}
    restart: unless-stopped
    profiles: ["prod"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://fizzo:fizzo@db:5432/fizzo?schema=public
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      NEXT_PUBLIC_TELEGRAM_BOT_USERNAME: ${NEXT_PUBLIC_TELEGRAM_BOT_USERNAME}
      SESSION_SECRET: ${SESSION_SECRET}
      ADMIN_TELEGRAM_IDS: ${ADMIN_TELEGRAM_IDS}
      ADMIN_DASHBOARD_USERNAME: ${ADMIN_DASHBOARD_USERNAME}
      ADMIN_DASHBOARD_PASSWORD: ${ADMIN_DASHBOARD_PASSWORD}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      DEV_LOGIN: "false"
      NODE_ENV: production
      PORT: "3000"
    ports:
      - "${APP_PORT:-3000}:3000"

  # One-off tasks (migrations, seeding) need the real `prisma` CLI, the
  # generated client, and dev tooling like `tsx`/`dotenv` — none of which
  # exist in the slim `app` runtime image (Next.js standalone output only
  # bundles what `next start` itself needs). The `builder` stage already has
  # all of it, so reuse it here instead of bloating the production image.
  # Usage: docker compose --profile prod run --rm migrate npx prisma migrate deploy
  #        docker compose --profile prod run --rm migrate npm run db:seed
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
      args:
        NEXT_PUBLIC_TELEGRAM_BOT_USERNAME: ${NEXT_PUBLIC_TELEGRAM_BOT_USERNAME}
        NEXT_PUBLIC_GA_MEASUREMENT_ID: ${NEXT_PUBLIC_GA_MEASUREMENT_ID}
    profiles: ["prod"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://fizzo:fizzo@db:5432/fizzo?schema=public

volumes:
  fizzo_db_data:
