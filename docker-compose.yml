services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: fizzo
      POSTGRES_PASSWORD: fizzo
      POSTGRES_DB: fizzo
    ports:
      - "5434:5432"
    volumes:
      - fizzo_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fizzo -d fizzo"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    profiles: ["prod"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://fizzo:fizzo@db:5432/fizzo?schema=public
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      NEXT_PUBLIC_TELEGRAM_BOT_USERNAME: ${NEXT_PUBLIC_TELEGRAM_BOT_USERNAME}
      SESSION_SECRET: ${SESSION_SECRET}
      ADMIN_TELEGRAM_IDS: ${ADMIN_TELEGRAM_IDS}
      DEV_LOGIN: "false"
      NODE_ENV: production
      PORT: "3000"
    ports:
      - "3000:3000"

volumes:
  fizzo_db_data:
